<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevFlow</title>
   <link rel="stylesheet" href="../styles/dashboard.css">
   <link rel="stylesheet" href="../styles/style.css">
    
</head>
<body>
<nav class="navbar"> 
    
    <div class="logo">DevFlow</div>

    <ul class="nav-links">

        <li><a href="dashboard.html">Dashboard</a></li>
         <li><a href="tasks.html">Tasks</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="roadmap.html">Roadmap</a></li>
        <li><a href="notes.html">Notes</a></li>
    </ul>

</nav>
   
<main class="dashboard">
    <section class="welcome-section">

        <div class="welcome">
            <h1>Welcome to DevFlow 👋</h1><br>
            <p>
              Manage your projects, organize your tasks,
              and track your learning journey as a developer.
           </p>
           <br>

           <button class="start" id="startLearning">
             Start Learning
           </button>

         </div>
      
    </section>

    <section class="stat">
        <div class="stat-card">
            <h3>Total Projects</h3>
            <p id="totalProjects">0</p>
        </div>

        <div class="stat-card">
            <h3>Total Tasks</h3>
            <p id="totalTasks">0</p>
        </div>

        <div class="stat-card">
            <h3>Learning Progress</h3>
            <p id="learningProgress">0%</p>
        </div>

    </section>

    <section class="recent-projects" id="recentProjectsSection">

    <h2>Recent Projects</h2>

    <div class="projects-container" id="recentProjects"></div>

</section>   

<section class="today-tasks" id="todayTasksSection">

    <h2>Today's Tasks</h2>

    <div class="tasks-container" id="todayTasks">

    </div>

</section>
</main>    
<script src="../js/dashboard.js"></script>
</body>
</html>
